[workspace]
members = ["crates/batter", "crates/batter-core", "crates/batter-axum", "crates/batter-sqlx", "crates/batter-runledger", "crates/batter-runlimit", "crates/batter-test-support", "examples/postgres-lifecycle", "examples/reference-service"]
default-members = ["crates/batter", "crates/batter-core", "crates/batter-axum", "crates/batter-test-support"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[workspace.dependencies]
batter = { path = "crates/batter", default-features = false }
batter-axum = { path = "crates/batter-axum", default-features = false }
batter-core = { path = "crates/batter-core" }
batter-runledger = { path = "crates/batter-runledger", default-features = false }
batter-runlimit = { path = "crates/batter-runlimit", default-features = false }
batter-sqlx = { path = "crates/batter-sqlx", default-features = false }
batter-test-support = { path = "crates/batter-test-support", default-features = false }
runledger-runtime = { git = "https://github.com/bpcakes/runledger", rev = "a8f62833d4801c342b4e4244aeae8607fc26ae35" }
runledger-postgres = { git = "https://github.com/bpcakes/runledger", rev = "a8f62833d4801c342b4e4244aeae8607fc26ae35" }
runledger-core = { git = "https://github.com/bpcakes/runledger", rev = "a8f62833d4801c342b4e4244aeae8607fc26ae35" }

pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"
tracing-core = "0.1.36"
thiserror = "2.0.20"
axum = "0.8.9"
cookie = { version = "0.18.2", default-features = false }
http-body = "1.0.1"
serde = "1.0.229"
sqlx = { version = "0.9.0", default-features = false }
tracing-subscriber = "0.3.23"
tower = "0.5.3"
url = { version = "2.5.8", default-features = false, features = ["std"] }

[patch."https://github.com/bpcakes/runledger"]
batter-sqlx = { path = "crates/batter-sqlx" }
