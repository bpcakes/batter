[package]
name = "batter"
description = "Cohesive facade for Batter's native operational toolkit"
version = "0.0.1"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter"
publish = ["crates-io"]
readme = "README.md"
autoexamples = false

[lints]
workspace = true

[features]
default = []
at-rest = ["dep:batter-at-rest"]
axum = ["dep:batter-axum"]
sqlx = ["dep:batter-sqlx"]
runledger = ["dep:batter-runledger", "sqlx"]
runlimit = ["dep:batter-runlimit"]
runlimit-memory = ["runlimit", "batter-runlimit/memory"]
runlimit-postgres = ["runlimit", "batter-runlimit/postgres"]
runlimit-axum = ["runlimit", "axum", "batter-runlimit/axum"]
test-support = ["dep:batter-test-support"]
sqlx-test-support = ["sqlx", "test-support", "batter-sqlx/test-support"]

[dependencies]
batter-core = { path = "../batter-core", version = "0.0.1", default-features = false }
batter-at-rest = { workspace = true, optional = true }
batter-axum = { workspace = true, optional = true }
batter-sqlx = { workspace = true, optional = true }
batter-runledger = { workspace = true, optional = true }
batter-runlimit = { workspace = true, optional = true }
batter-test-support = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
runlimit-core = { workspace = true }
runlimit-memory = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "signal", "net"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[example]]
name = "worker"

[[example]]
name = "process_owned"

[[example]]
name = "operation_budget"

[[example]]
name = "finite_command"
test = true

[[example]]
name = "http_service"
test = true
required-features = ["axum"]

[[example]]
name = "owned_pool"
required-features = ["sqlx"]

[[example]]
name = "verification"
required-features = ["sqlx"]

[[example]]
name = "quota_service"
required-features = ["runlimit-memory", "runlimit-axum"]
