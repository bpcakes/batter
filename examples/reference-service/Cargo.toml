[package]
name = "batter-example-reference-service"
description = "Executable native SQLx, Runledger and PostgreSQL harness compatibility probes"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false
default-run = "batter-example-reference-service"

[lints]
workspace = true

[features]
default = []
# Opt-in application-root OTLP/HTTP metrics export. Default builds stay silent.
metrics-export = ["batter/otlp", "dep:opentelemetry-proto", "dep:prost"]

[dependencies]
batter = { workspace = true, features = ["axum", "sqlx", "runledger"] }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["gen-tonic-messages", "metrics"], optional = true }
prost = { version = "0.14.1", default-features = false, features = ["std"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
url = "2.5.8"
percent-encoding = "2.3.2"
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
axum.workspace = true
tower = { workspace = true, features = ["util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
uuid = { version = "1", features = ["serde", "v7"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
runledger-core.workspace = true
runledger-postgres.workspace = true
runledger-runtime.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio-postgres = "=0.7.18"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
batter = { workspace = true, features = ["sqlx-test-support"] }
postgres-test-harness = { git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "test-util", "net", "io-util"] }

[[example]]
name = "retire_startup_controls"
test = true

[[test]]
name = "metrics_export"
required-features = ["metrics-export"]

[[bin]]
name = "signal_witness_fixture"
path = "tests/fixtures/signal_witness_fixture.rs"
test = false
bench = false
doc = false
