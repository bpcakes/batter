[package]
name = "batter-flags-cli"
description = "Operator command for the batter-flags control plane"
version = "0.0.1"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Owner question 8: unpublished until the release-train record decides otherwise.
publish = false
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "batter-flags"
path = "src/main.rs"
# The binary shares its name with the batter-flags library; documenting both
# would write the same target/doc/batter_flags page. The command has no API.
doc = false

[dependencies]
batter-core.workspace = true
batter-flags-core = { workspace = true, features = ["serde"] }
batter-flags-postgres.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The operator command connects over TLS on its own; this entry, not feature
# unification elsewhere in the workspace, must select the rustls provider.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }

[dev-dependencies]
# A per-test database for the ignored live suite.
postgres-test-harness = { version = "0.2.0", git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false }
