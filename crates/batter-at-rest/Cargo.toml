[package]
name = "batter-at-rest"
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
publish = ["crates-io"]
license = "MIT"
description = "Standalone application-layer envelope encryption and stable MAC keys"
readme = "README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
documentation = "https://docs.rs/batter-at-rest"

[features]
test-support = []

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.13.0"
hmac = "0.13.0"
getrandom = "0.4.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
mod_module_files = "warn"
