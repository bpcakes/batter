[package]
publish = false
name = "runledger-tui"
version = "0.12.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Read-only terminal UI for monitoring Runledger jobs and workflows"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
keywords = ["jobs", "workflows", "postgres", "tui"]
categories = ["command-line-utilities", "asynchronous"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[[bin]]
name = "runledger-tui"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
runledger-core = { workspace = true }
runledger-postgres = { workspace = true }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
