[package]
name = "runlimit-http"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
description = "Framework-neutral HTTP rate-limit response metadata"
documentation = "https://docs.rs/runlimit-http"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
keywords = ["rate-limit", "http", "headers", "throttling"]
categories = ["web-programming"]

[dependencies]
http = { version = "1.4.2" }
runlimit-core.workspace = true
thiserror = { version = "2.0.12" }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
