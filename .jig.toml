[vault]
scope = "repo"
scope_id = "01M1ZXBGBDQFCZ1JJ032N3T028"
allow_global = false

[commands]
api_http_smoke_command = "python3 scripts/check_http_smokes.py"
api_docs_command = "RUSTDOCFLAGS=\"${RUSTDOCFLAGS:-} -D warnings\" cargo doc --workspace --all-features --no-deps --locked"
api_clippy_command = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::mod_module_files && cargo clippy -p runlimit-core -p runlimit-memory -p runlimit-postgres -p runlimit-http -p runlimit-axum --all-targets --locked -- -D warnings"
api_fmt_command = "cargo fmt --all -- --check"
api_test_command = "python3 scripts/test_matrix.py workspace"
api_test_locked_command = "python3 scripts/test_matrix.py workspace"
api_no_default_features_command = "python3 scripts/test_matrix.py no-default-features"
api_doctest_command = "python3 scripts/test_matrix.py doctests"
api_consumers_command = "python3 scripts/test_matrix.py consumers"
api_runlimit_command = "python3 scripts/test_matrix.py runlimit"
repo_script_tests_command = "python3 scripts/test_matrix.py scripts"
repo_batter_at_rest_portability_command = "scripts/check-batter-at-rest-portability.sh"
repo_bootstrap_command = "cargo fetch --locked"

[execution]
command_timeout_seconds = 1800
command_output_limit_bytes = 67108864

[loop]
lease_ttl_seconds = 3600

[[loop.workflows]]
id = "daily-bug-scan"
kind = "codex_task"
schedule = "0 20 * * *"
timezone = "Europe/Prague"
prompt_file = ".agent/tasks/daily-bug-scan.md"
codex_home = "codex"
sandbox = "workspace-write"
checkout = "repo"

# No gated check reads the root Beads store. Excluding it from working-file
# freshness and from the worktree invariant around each parallel batch keeps
# tracker writes from failing an in-flight check.
[work]
receipt_metadata = ["beads"]

[[work.gates]]
id = "verify"
kind = "evidence"
profile = "verify"
conclusion = "success"

[[agent_tooling.codex.marketplaces]]
id = "jig-skills"
source = "bpcakes/jig-skills"
plugins = ["jig-rust@jig-skills", "jig-exec-plans@jig-skills"]
