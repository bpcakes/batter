[package]
name = "batter-runledger"
description = "Owned Runledger initialization and native descendant settlement for Batter"
version = "0.0.1"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-runledger"
publish = ["crates-io"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# Reachability for Runledger's own Docker-provisioned PostgreSQL test support.
# Test-only; it selects no runtime behaviour and stays out of the default graph.
test-support = ["dep:runledger-test-support"]

[dependencies]
batter-core.workspace = true
batter-sqlx.workspace = true
# Declared directly so `native::core` can re-export the one native identity that
# `runledger-postgres` and `runledger-runtime` already resolve.
runledger-core.workspace = true
runledger-postgres.workspace = true
runledger-runtime.workspace = true
runledger-test-support = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["postgres"] }
# Converts the native std deadline to the same monotonic clock as Tokio timers.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
batter-test-support.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
