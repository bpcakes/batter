# Contract v8 runtime from Jig v0.5.0, pinned for exhaustive target freshness.
# Use update --recopy to retain it; plain update advances the upstream branch.
_commit = "a328c17910c40603327c73329e5158a42c37417d"
_src_path = "https://github.com/bpcakes/jig-sh.git"
repo_name = "batter"
default_branch = "master"
ci_github_runner = "ubuntu-latest"
template_source_url = ""
harness_footprint = "full"

sqlx_enabled = false
rust_crate_roots = ["crates", "examples", "runledger"]

schema_dump_enabled = false

# Commands are owned by this Rust workspace; all dependency operations are locked.

application_contracts_enabled = false
frontend_workspace_roots = []

frontend_apps = []

[repository]
default_check_profile = "verify"
affected_ignore = [".env", ".env.*", "**/.env", "**/.env.*", "README.md", "**/README.md", "AGENTS.md", "**/AGENTS.md", "agent-map.md", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "docs/**", "LICENSE", "LICENSE.*", ".github/**"]

[[repository.components]]
id = "api"
root = "."
description = "Rust library workspace and examples."
tags = ["backend"]
propagate_affected_to_dependents = true
adapters = ["rust"]

[repository.components.provenance]
adapters = "inferred"
id = "inferred"
root = "inferred"

[[repository.components]]
id = "repo"
root = "."
description = "Repository-wide Jig policy and compatibility actions."
tags = ["repository"]
adapters = ["jig"]

[repository.components.provenance]
adapters = "inherited"
id = "inferred"
root = "inferred"

