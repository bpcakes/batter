# Clippy reads the nearest clippy.toml only, so this file replaces
# runlimit/clippy.toml for runlimit-postgres and repeats its settings first.
cognitive-complexity-threshold = 20

# This crate sends SQL text only through `statements::Statement::query`, the
# one site allowed to call `sqlx::query`; the bundled migrators run only the
# migrations `sqlx::migrate!` embeds. Every sqlx 0.9 entry point that accepts
# SQL text, makes text acceptable, builds SQL from a name this crate supplies
# or calls a catalog function through `search_path` is disallowed, so Clippy
# resolves each call, import, rename and trait method to it.
# `src/catalog_guard/gate.rs` pins this inventory, probes each entry and
# checks that nothing else suppresses these lints.
disallowed-methods = [
    { path = "sqlx::query", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_with", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::__query_with_result", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_as", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_as_with", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_scalar", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_scalar_with", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::__query_scalar_with_result", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::raw_sql", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::Executor::execute", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::execute_many", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::fetch", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::fetch_many", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::fetch_all", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::fetch_one", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::fetch_optional", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::prepare", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::prepare_with", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Executor::describe", reason = "execute a Statement's query instead of raw text" },
    { path = "sqlx::Statement::query", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Statement::query_with", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Statement::query_as", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Statement::query_as_with", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Statement::query_scalar", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Statement::query_scalar_with", reason = "a prepared statement holds SQL outside the statement inventory" },
    { path = "sqlx::Connection::begin_with", reason = "begin transactions with the default statement" },
    { path = "sqlx::Pool::begin_with", reason = "begin transactions with the default statement" },
    { path = "sqlx::Pool::try_begin_with", reason = "begin transactions with the default statement" },
    { path = "sqlx::postgres::PgConnection::copy_in_raw", reason = "COPY takes SQL text" },
    { path = "sqlx::postgres::PgConnection::copy_out_raw", reason = "COPY takes SQL text" },
    { path = "sqlx::postgres::PgPoolCopyExt::copy_in_raw", reason = "COPY takes SQL text" },
    { path = "sqlx::postgres::PgPoolCopyExt::copy_out_raw", reason = "COPY takes SQL text" },
    { path = "sqlx::SqlSafeStr::into_sql_str", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::Execute::sql", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::Transaction::begin", reason = "begin transactions with the default statement" },
    { path = "sqlx::migrate::Migrator::new", reason = "run only the migrations sqlx::migrate! embeds" },
    { path = "sqlx::migrate::Migrator::run", reason = "run migrations only through PgLimiterBase::migrate" },
    { path = "sqlx::migrate::Migrator::run_to", reason = "run migrations only through PgLimiterBase::migrate" },
    { path = "sqlx::migrate::Migrator::run_direct", reason = "run migrations only through PgLimiterBase::migrate" },
    { path = "sqlx::migrate::Migrator::skip", reason = "run migrations only through PgLimiterBase::migrate" },
    { path = "sqlx::migrate::Migrator::undo", reason = "run migrations only through PgLimiterBase::migrate" },
    { path = "sqlx::migrate::Migrator::dangerous_set_table_name", reason = "migration table names are interpolated into SQL" },
    { path = "sqlx::migrate::Migrator::create_schema", reason = "migration schema names are interpolated into SQL" },
    { path = "sqlx::migrate::MigrationSource::resolve", reason = "run only the migrations sqlx::migrate! embeds" },
    { path = "sqlx::migrate::resolve_blocking", reason = "run only the migrations sqlx::migrate! embeds" },
    { path = "sqlx::migrate::resolve_blocking_with_config", reason = "run only the migrations sqlx::migrate! embeds" },
    { path = "sqlx::migrate::Migrate::create_schema_if_not_exists", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::ensure_migrations_table", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::dirty_version", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::list_applied_migrations", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::lock", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::unlock", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::apply", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::revert", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::Migrate::skip", reason = "sends sqlx-built SQL; run migrations through the bundled migrators" },
    { path = "sqlx::migrate::MigrateDatabase::create_database", reason = "sends SQL built from a database URL" },
    { path = "sqlx::migrate::MigrateDatabase::database_exists", reason = "sends SQL built from a database URL" },
    { path = "sqlx::migrate::MigrateDatabase::drop_database", reason = "sends SQL built from a database URL" },
    { path = "sqlx::migrate::MigrateDatabase::force_drop_database", reason = "sends SQL built from a database URL" },
    { path = "sqlx::testing::TestFn::run_test", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestSupport::test_context", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestSupport::cleanup_test", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestSupport::cleanup_test_dbs", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestSupport::snapshot", reason = "sqlx::testing runs fixture SQL and manages databases" },
]
disallowed-types = [
    { path = "sqlx::AssertSqlSafe", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::SqlStr", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::QueryBuilder", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::RawSql", reason = "SQL text comes only from a Statement" },
    { path = "sqlx::migrate::Migration", reason = "run only the migrations sqlx::migrate! embeds" },
    { path = "sqlx::postgres::PgListener", reason = "LISTEN statements are built from channel names" },
    { path = "sqlx::postgres::PgAdvisoryLock", reason = "its SQL calls pg_advisory_lock through search_path; lock with a Statement" },
    { path = "sqlx::testing::TestArgs", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestFixture", reason = "sqlx::testing runs fixture SQL and manages databases" },
    { path = "sqlx::testing::TestContext", reason = "sqlx::testing runs fixture SQL and manages databases" },
]
disallowed-macros = [
    { path = "sqlx::query", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_as", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_as_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file_as", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file_as_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_scalar", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_scalar_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file_scalar", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::query_file_scalar_unchecked", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::sqlx_macros::expand_query", reason = "run SQL only through statements::Statement::query" },
    { path = "sqlx::test", reason = "sqlx::testing runs fixture SQL and manages databases" },
]
