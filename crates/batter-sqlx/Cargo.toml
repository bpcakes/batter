[package]
name = "batter-sqlx"
description = "Owned PostgreSQL transaction, snapshot, verification, and connection disposition APIs"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false
readme = "README.md"
autotests = false
autoexamples = false

[lints]
workspace = true

[features]
test-support = ["dep:postgres-test-harness", "dep:batter-test-support", "dep:tokio", "dep:futures-util"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
postgres-test-harness = { git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false, optional = true }
batter-test-support = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"], optional = true }
batter-core.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "migrate"] }

[dev-dependencies]
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
sqlx = { workspace = true, features = ["tls-rustls-ring"] }
batter-test-support.workspace = true

[[test]]
name = "offline"

[[test]]
name = "postgres_live"

[[test]]
name = "pool_ownership_live"

[[test]]
name = "verification_live"
required-features = ["test-support"]

[[test]]
name = "fixture_offline"
required-features = ["test-support"]

[[test]]
name = "migrations_live"

[[test]]
name = "atomic_live"

[[test]]
name = "profile"
