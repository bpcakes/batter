[package]
name = "batter-flags"
description = "Typed flags and kill switches for Batter: declared mode and the optional audited control plane"
version = "0.0.1"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-flags"
publish = ["crates-io"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
# The audited PostgreSQL control plane: the native store, the owned pool and
# lease path, time-ordered process identities and the last-good file trailer.
postgres = ["dep:batter-flags-postgres", "dep:batter-sqlx", "dep:sqlx", "dep:uuid", "dep:sha2"]
# Route-group gates on the Batter Axum adapter; the extractor needs axum itself.
axum = ["dep:batter-axum", "dep:axum"]
# Job-handler gates and pinned decisions over the native Runledger job types.
runledger = ["dep:runledger-core"]

[dependencies]
batter-core.workspace = true
batter-flags-core = { workspace = true, features = ["serde"] }
pin-project-lite.workspace = true
serde_json = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
batter-flags-postgres = { workspace = true, optional = true }
batter-sqlx = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["postgres"], optional = true }
uuid = { version = "1", features = ["v7"], optional = true }
sha2 = { version = "0.11.1", optional = true }
batter-axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
runledger-core = { workspace = true, optional = true }

[dev-dependencies]
# `HandlerInvocation` for worker-free job-gate tests, reached natively and
# never through the facade.
batter-runledger = { workspace = true, features = ["test-support"] }
batter-test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
# A per-test database for the live control-plane contracts.
postgres-test-harness = { version = "0.2.0", git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false }

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "control_plane_live"
required-features = ["postgres"]

[[test]]
name = "jobs_live"
required-features = ["runledger", "postgres"]
