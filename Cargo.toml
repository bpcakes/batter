[workspace]
members = ["crates/batter", "crates/batter-at-rest", "crates/batter-core", "crates/batter-axum", "crates/batter-sqlx", "crates/batter-runledger", "crates/batter-runlimit", "crates/batter-test-support", "examples/postgres-lifecycle", "examples/reference-service", "runledger/runledger-core", "runledger/runledger-postgres", "runledger/runledger-runtime", "runledger/runledger-test-support", "runledger/runledger-tui", "runlimit/runlimit-axum", "runlimit/runlimit-core", "runlimit/runlimit-http", "runlimit/runlimit-memory", "runlimit/runlimit-postgres"]
default-members = ["crates/batter", "crates/batter-core", "crates/batter-axum", "crates/batter-test-support"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"

[workspace.lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"

[workspace.dependencies]
batter = { path = "crates/batter", version = "0.0.1", default-features = false }
batter-at-rest = { path = "crates/batter-at-rest", version = "0.0.1", default-features = false }
batter-axum = { path = "crates/batter-axum", version = "0.0.1", default-features = false }
batter-core = { path = "crates/batter-core", version = "0.0.1" }
batter-runledger = { path = "crates/batter-runledger", version = "0.0.1", default-features = false }
batter-runlimit = { path = "crates/batter-runlimit", version = "0.0.1", default-features = false }
batter-sqlx = { path = "crates/batter-sqlx", version = "0.0.1", default-features = false }
batter-test-support = { path = "crates/batter-test-support", version = "0.0.1", default-features = false }
runledger-runtime = { path = "runledger/runledger-runtime", version = "0.13.0" }
runledger-postgres = { path = "runledger/runledger-postgres", version = "0.13.0" }
runledger-core = { path = "runledger/runledger-core", version = "0.13.0" }

runledger-test-support = { path = "runledger/runledger-test-support", version = "0.13.0" }
cron = "0.17"

pin-project-lite = "0.2.17"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.44"
tracing-core = "0.1.36"
thiserror = "2.0.20"
axum = "0.8.9"
cookie = { version = "0.18.2", default-features = false }
http-body = "1.0.1"
serde = "1.0.229"
sqlx = { version = "0.9.0", default-features = false }
tracing-subscriber = "0.3.23"
tower = "0.5.3"
url = { version = "2.5.8", default-features = false, features = ["std"] }

runlimit-axum = { path = "runlimit/runlimit-axum", version = "0.4.0" }
runlimit-core = { path = "runlimit/runlimit-core", version = "0.4.0" }
runlimit-http = { path = "runlimit/runlimit-http", version = "0.4.0" }
runlimit-memory = { path = "runlimit/runlimit-memory", version = "0.4.0" }
runlimit-postgres = { path = "runlimit/runlimit-postgres", version = "0.4.0" }
