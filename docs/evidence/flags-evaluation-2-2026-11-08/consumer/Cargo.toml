[package]
name = "checkout-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
batter = { path = "/Users/aa/Documents/batter/crates/batter", default-features = false, features = ["flags-postgres", "flags-axum", "flags-runledger"] }
# Ordinary ecosystem crates, all already resolved by Cargo.lock.
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `macros` and `migrate` for the application's own `sqlx::migrate!` bundle;
# `json` binds the stored pin to a jsonb column. No TLS provider is selected:
# see the note on `DATABASE_URL` in `src/config.rs`.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "json", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tracing = "0.1.44"

# Added on archiving, so this copy builds standalone inside the repository.
[workspace]
