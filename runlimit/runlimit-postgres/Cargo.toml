[package]
name = "runlimit-postgres"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
description = "Replica-safe PostgreSQL rate-limit storage"
documentation = "https://docs.rs/runlimit-postgres"
readme = "../README.md"
repository = "https://github.com/bpcakes/runlimit"
keywords = ["rate-limit", "throttling", "postgres"]
categories = ["web-programming", "database"]

[features]
serde = ["dep:serde", "runlimit-core/serde"]

[dependencies]
runlimit-core.workspace = true
serde = { version = "1.0.219", features = ["derive"], optional = true }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
] }
thiserror = { version = "2.0.12" }
tokio = { version = "1.47.1", default-features = false, features = ["time"] }

[dev-dependencies]
runlimit-memory.workspace = true
serde_json = { version = "1.0.140" }
tokio = { version = "1.47.1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
