[package]
name = "batter-core"
links = "batter_core_foundation"
description = "Native Tokio operational foundation used by the Batter facade"
version = "0.0.1"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-core"
publish = ["crates-io"]
readme = "README.md"
autoexamples = false

[lints]
workspace = true

[dependencies]
pin-project-lite.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "signal"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
batter-test-support.workspace = true
tracing-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "signal", "net"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
