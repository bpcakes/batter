[package]
name = "batter-sqlx"
description = "Explicit PostgreSQL connection disposition for native SQLx operations"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false
readme = "README.md"
autotests = false

[lints]
workspace = true

[features]
test-support = ["dep:postgres-test-harness", "dep:batter-test-support", "dep:tokio", "dep:futures-util"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["std"], optional = true }
postgres-test-harness = { git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false, optional = true }
batter-test-support = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"], optional = true }
batter.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
sqlx = { workspace = true, features = ["tls-rustls-ring"] }
batter-test-support.workspace = true

[[test]]
name = "offline"

[[test]]
name = "postgres_live"

[[test]]
name = "fixture_offline"
required-features = ["test-support"]
