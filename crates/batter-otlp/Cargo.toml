[package]
name = "batter-otlp"
description = "Bounded OTLP metrics export through Batter-owned service completion"
version = "0.0.1"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
batter-core = { workspace = true, features = ["metrics"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
url.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
thiserror.workspace = true
metrics-exporter-otel = { version = "0.3.1" }
opentelemetry = { version = "0.31.0", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["metrics", "experimental_metrics_custom_reader"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["http-proto", "metrics"] }
opentelemetry-http = { version = "0.31.0", default-features = false }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = { version = "0.14.1", default-features = false, features = ["std"] }
bytes = { version = "1.10.1" }
http = { version = "1.3.1" }
async-trait = { version = "0.1.89" }

[dev-dependencies]
h2 = "0.4.19"
reqwest = { version = "0.12.28", default-features = false, features = ["http2"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net", "io-util"] }
