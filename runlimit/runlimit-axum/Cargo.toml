[package]
name = "runlimit-axum"
version = "0.4.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = ["crates-io"]
description = "Application-owned Axum admission middleware for Runlimit"
documentation = "https://docs.rs/runlimit-axum"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
keywords = ["rate-limit", "axum", "tower", "throttling"]
categories = ["web-programming"]

[dependencies]
axum = { version = "0.8.4", default-features = false }
runlimit-core.workspace = true
tower = { version = "0.5.2" }

[dev-dependencies]
bytes = "1.10.1"
http-body = { version = "1.0.1" }
tokio = { version = "1.47.1", default-features = false, features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
