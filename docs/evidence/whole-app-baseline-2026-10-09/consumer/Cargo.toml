[package]
name = "records-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
description = "A small records API with a durable notification worker, built on the Batter facade."

# Standalone evidence package: not a workspace member.
[workspace]

[dependencies]
batter = { path = "../../../../crates/batter", features = ["axum", "runledger"] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
