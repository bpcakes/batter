name: Rust verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.94.0", "1.98.1", "stable"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy
      - name: Verify (bootstrap only while the initial lockfile is absent)
        shell: bash
        run: |
          if [[ -f Cargo.lock ]]; then
            bash scripts/verify.sh
          else
            echo 'Initial unverified snapshot: bootstrap formats and resolves. Commit its outputs after validation.'
            bash scripts/verify.sh --bootstrap
          fi
      - name: Build and smoke-test the HTTP example
        run: |
          cargo build --example http_service --features axum --locked
          python3 scripts/smoke_http.py --binary target/debug/examples/http_service
          python3 scripts/smoke_http.py --binary target/debug/examples/http_service --signal SIGINT
          python3 scripts/smoke_http.py --binary target/debug/examples/http_service --deadline
