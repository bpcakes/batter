[package]
publish = ["crates-io"]
name = "runledger-postgres"
version = "0.13.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "PostgreSQL persistence layer for the Runledger durable job and workflow system"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
documentation = "https://docs.rs/runledger-postgres"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[features]
test-support = []

[dependencies]
batter-sqlx.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = { workspace = true }
runledger-core = { workspace = true, features = ["sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
tempfile = "3"
static_assertions = "1.1.0"
runledger-test-support = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "io-util", "net"] }
