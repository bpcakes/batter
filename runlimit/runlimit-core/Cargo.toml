[package]
name = "runlimit-core"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false
description = "Framework-neutral rate-limit policies, keys, and decisions"
documentation = "https://docs.rs/runlimit-core"
readme = "../README.md"
repository = "https://github.com/bpcakes/runlimit"
keywords = ["rate-limit", "throttling", "security"]
categories = ["web-programming"]

[features]
serde = ["dep:serde"]

[dependencies]
hmac = { version = "0.13.0", features = ["zeroize"] }
serde = { version = "1.0.219", features = ["derive"], optional = true }
sha2 = { version = "0.11.0", features = ["zeroize"] }
thiserror = { version = "2.0.12" }

[dev-dependencies]
serde_json = { version = "1.0.140" }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
