[package]
publish = false
name = "runledger-runtime"
version = "0.12.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Async worker, scheduler, and reaper runtime for the Runledger job system"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
documentation = "https://docs.rs/runledger-runtime"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cron = { workspace = true }
futures-util = "0.3"
runledger-core = { workspace = true }
runledger-postgres = { workspace = true }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
serde = { version = "1", features = ["derive"] }
runledger-postgres = { workspace = true, features = ["test-support"] }
runledger-test-support = { workspace = true }
tracing-subscriber = "0.3"

[[example]]
name = "producer"
path = "examples/producer_worker/producer.rs"

[[example]]
name = "worker"
path = "examples/producer_worker/worker.rs"
test = true
