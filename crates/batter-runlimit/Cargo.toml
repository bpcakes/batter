[package]
name = "batter-runlimit"
description = "Protected native Runlimit quota execution and optional authenticated HTTP composition"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false
autoexamples = false

[features]
default = []
memory = ["dep:runlimit-memory"]
postgres = ["dep:runlimit-postgres", "dep:batter-sqlx", "dep:sqlx"]
axum = ["dep:axum", "dep:batter-axum", "dep:tokio", "dep:tower", "dep:serde_json"]

[dependencies]
batter-core.workspace = true
batter-sqlx = { workspace = true, optional = true }
sqlx = { workspace = true, features = ["postgres"], optional = true }
thiserror.workspace = true
runlimit-core = { git = "https://github.com/bpcakes/runlimit", rev = "36ba4ee9207fd6834a8de9bf602c1d9ebb154cf5" }
runlimit-memory = { git = "https://github.com/bpcakes/runlimit", rev = "36ba4ee9207fd6834a8de9bf602c1d9ebb154cf5", optional = true }
runlimit-postgres = { git = "https://github.com/bpcakes/runlimit", rev = "36ba4ee9207fd6834a8de9bf602c1d9ebb154cf5", optional = true }
axum = { workspace = true, optional = true }
batter-axum = { path = "../batter-axum", optional = true }
tokio = { workspace = true, features = ["net"], optional = true }
tower = { workspace = true, features = ["util"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net", "io-util"] }
http-body.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "quota"
required-features = ["memory"]

[[test]]
name = "http"
required-features = ["axum", "memory"]

[[test]]
name = "attempts_live"
required-features = ["postgres"]

[lints]
workspace = true
