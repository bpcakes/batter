name: Jig integration

on:
  pull_request:
  push:
    branches:
      - "master"
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-policy-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jig:
    name: Verify Jig contract, guides, and file budgets
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Cache Jig runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .git/jig-tools/*-runtime
          key: ${{ runner.os }}-${{ runner.arch }}-jig-runtime-${{ hashFiles('.jig.toml', '.agent/jig-contract.json', 'rust-toolchain.toml', 'scripts/jig', 'scripts/install-jig.sh', '.github/workflows/repo-policy.yml') }}
      - name: Check Jig installation and wiring
        run: |
          scripts/jig doctor
          scripts/jig check contract
          scripts/jig check agent-map
          scripts/jig check agent-guides
      - name: Test Jig integration and source packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check repository file-budget policy
        env:
          JIG_EVENT_NAME: ${{ github.event_name }}
          JIG_PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          JIG_PUSH_BEFORE: ${{ github.event.before }}
          JIG_MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: bash scripts/check_file_budget.sh
