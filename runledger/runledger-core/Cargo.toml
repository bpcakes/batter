[package]
publish = ["crates-io"]
name = "runledger-core"
version = "0.13.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Core contracts and types for the Runledger durable job and workflow system"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
documentation = "https://docs.rs/runledger-core"
exclude = ["AGENTS.md"]
keywords = ["jobs", "workflows", "postgres", "queue"]
categories = ["asynchronous", "database"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
future_not_send = "deny"
large_futures = "deny"
large_stack_frames = "deny"

[features]
sqlx-postgres = ["dep:sqlx"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", optional = true, default-features = false, features = ["postgres"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
proptest = "1.11"
