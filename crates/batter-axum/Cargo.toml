[package]
name = "batter-axum"
description = "Axum request boundaries and lifecycle probes for Batter"
version = "0.0.1"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-axum"
publish = ["crates-io"]
readme = "README.md"
autoexamples = false

[lints]
workspace = true

[dependencies]
batter-core.workspace = true
axum.workspace = true
cookie.workspace = true
pin-project-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "net"] }
tracing.workspace = true
tower = { workspace = true, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["request-id"] }
url.workspace = true

[dev-dependencies]
http-body.workspace = true
# Test-only TLS material and transport. Batter owns no certificate, provider or
# handshake policy; these prove the generic listener contract end to end.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "macros", "signal", "net", "io-util"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
