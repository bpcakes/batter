[package]
name = "runflag-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
# Owner question 8: unpublished until the release-train record decides otherwise.
publish = false
description = "Operator command for the runflag control plane"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"

[[bin]]
name = "runflag"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
runflag-core = { workspace = true, features = ["serde"] }
runflag-postgres.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The operator command connects over TLS on its own; this entry, not feature
# unification elsewhere in the workspace, must select the rustls provider.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-ring"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
panic = "deny"
unreachable = "deny"
unwrap_used = "deny"
