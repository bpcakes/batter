[package]
name = "batter-axum"
description = "Axum request boundaries and lifecycle probes for Batter"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
publish = false
readme = "README.md"
autoexamples = false

[lints]
workspace = true

[dependencies]
batter.workspace = true
axum.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time", "net"] }
tracing.workspace = true
tower-http = { version = "0.6.11", default-features = false, features = ["request-id"] }

[dev-dependencies]
http-body = "1.0.1"
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "macros", "signal", "net", "io-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tower = { workspace = true, features = ["util"] }

[[example]]
name = "http_service"
