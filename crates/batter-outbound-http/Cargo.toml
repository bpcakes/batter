[package]
name = "batter-outbound-http"
description = "Send-once outbound HTTP exchange with exhaustive transport evidence"
version = "0.0.1"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-outbound-http"
publish = ["crates-io"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
## Bridge `batter_core::operation::OperationContext` deadlines and cancellation.
operation = ["dep:batter-core"]

[dependencies]
batter-core = { workspace = true, optional = true }
bytes = "1.12.1"
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
url.workspace = true

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
# Compile reqwest's HTTP/2 and gzip support into test builds, as an unrelated
# dependency could through feature unification, so the tests can show that the
# fixed profile still refuses both.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
