[package]
name = "batter-flags-postgres"
description = "Audited PostgreSQL control-plane storage for batter-flags"
version = "0.0.1"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-flags-postgres"
publish = ["crates-io"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
batter-core.workspace = true
batter-sqlx.workspace = true
batter-flags-core = { workspace = true, features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `macros` only for `sqlx::migrate!`; queries run at runtime, so no `.sqlx`
# offline data and no `query!`.
sqlx = { workspace = true, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio = { workspace = true, features = ["time"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
postgres-test-harness = { version = "0.2.0", git = "https://github.com/bpcakes/postgres-test-harness.git", rev = "3d525e6fc5745ce2e2437c7997de5cccdecff4ac", default-features = false }
# Pins the migration checksums the schema tests assert.
sha2 = "0.11.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
