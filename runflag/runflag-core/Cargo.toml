[package]
name = "runflag-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = ["crates-io"]
description = "Framework-neutral typed flag and kill-switch catalog, snapshots and evaluation"
documentation = "https://docs.rs/runflag-core"
readme = "../README.md"
repository = "https://github.com/bpcakes/batter"
homepage = "https://github.com/bpcakes/batter"
keywords = ["feature-flags", "kill-switch", "configuration"]
categories = ["config"]

[features]
# Serialization for the manifest and snapshot types that the store and the
# operator command exchange. Off by default so the bare closure holds no
# serialization library.
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["registry"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
