# Pinned Jig runtime used only for the standalone file-budget checker.
_commit = "a328c17910c40603327c73329e5158a42c37417d"
_src_path = "https://github.com/bpcakes/jig-sh.git"
repo_name = "batter"
default_branch = "master"

# The runtime requires a catalog even for receipt-free diagnostics.
[repository]
default_check_profile = "file-budget"

[[repository.components]]
id = "repo"
root = "."
description = "Standalone source file-budget policy."
tags = ["repository"]
adapters = ["jig"]

[repository.components.provenance]
adapters = "inherited"
id = "inferred"
root = "inferred"

[[repository.actions]]
source_state = "git"
description = "Enforce repository-owned source file budgets."
inputs_policy = "whole_repository"
intent = "check"
effects = ["read_only"]
inputs = ["**"]
legacy_aliases = ["jig.file_budget"]

[repository.actions.target]
component = "repo"
action = "file-budget"

[repository.actions.runner]
kind = "native"
operation = "jig.file_budget"

[repository.actions.runner.configuration]
kind = "file_budget"
max_candidates = 10000
max_total_bytes = 268435456
missing_comparison = "block"

[repository.actions.provenance]
source_state = "inferred"
inputs_policy = "inferred"
effects = "inherited"
inputs = "inherited"
intent = "inherited"
legacy_aliases = "inherited"
runner = "inherited"
target = "inherited"

[[repository.profiles]]
id = "file-budget"
description = "Standalone source file-budget policy."
targets = [{ component = "repo", action = "file-budget" }]
