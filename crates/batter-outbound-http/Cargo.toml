[package]
name = "batter-outbound-http"
description = "Send-once outbound HTTP exchange with exhaustive transport evidence"
version = "0.0.1"
edition.workspace = true
rust-version = "1.98.1"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/batter-outbound-http"
publish = ["crates-io"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
## Bridge `batter_core::operation::OperationContext` deadlines and cancellation.
operation = ["dep:batter-core"]

[dependencies]
batter-core = { workspace = true, optional = true }
bytes = "1.12.1"
http = "1.5.0"
# The reqwest line whose transport classification this package's fault tests
# record (docs/references.md). A consumer's lockfile may resolve other
# compatible reqwest, hyper and hyper-util releases; re-run the tests on bumps.
# `rustls-no-provider` adds no aws-lc-rs: the client supplies its own ring
# configuration. In a graph that already compiles aws-lc-rs into rustls, the
# `ring` feature below is a second provider (see the Client rustdoc).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = "1.0.229"
serde_json = "1.0.151"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
url.workspace = true

[dev-dependencies]
# Compile reqwest's HTTP/2 and gzip support into test builds, as an unrelated
# dependency could through feature unification, so the tests can show that the
# fixed profile still refuses both.
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "http2", "rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
